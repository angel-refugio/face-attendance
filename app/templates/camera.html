{% extends "base.html" %}
{% block title %}Camara - FaceAttendance{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-camera"></i> Reconocimiento Facial</h2>
    <div>
        <button id="btnToggle" class="btn btn-primary">
            <i class="bi bi-play-fill"></i> Iniciar Camara
        </button>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body text-center">
                <video id="video" autoplay playsinline style="max-width: 100%; border-radius: 8px; background: #000;"></video>
                <canvas id="canvas" style="display: none;"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-clock-history"></i> Ultimos Registros</h5>
            </div>
            <div class="card-body" id="recentCheckins" style="max-height: 500px; overflow-y: auto;">
                <p class="text-muted text-center">Inicia la camara para ver registros</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
{% endblock %}
